[package]
name = "phylotrim"
version = "0.2.0"
edition = "2021"
description = "Minimalist, ultra-fast column-gap and 3-bp codon MSA trimmer in Rust"
license = "MIT"
repository = "https://github.com/Jhe1004/phylotrim"
readme = "README.md"
keywords = ["bioinformatics", "phylogenetics", "msa", "alignment", "trimming"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
memchr = "2"
rayon = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
